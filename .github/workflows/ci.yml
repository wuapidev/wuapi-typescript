# Typecheck, test, build and pack the package on its own, the way someone who
# clones this repository would: npm on each supported Node line, and Bun.
#
# This repository mirrors packages/wuapi-sdk of the wuapi monorepo (see
# CONTRIBUTING.md); the same checks run there before anything lands here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Maintained Node lines, which the dev tooling (vitest 4) supports.
        # The built package itself runs on Node 18+ (engines in package.json).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack (dry run)
        run: npm pack --dry-run

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --no-save
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
